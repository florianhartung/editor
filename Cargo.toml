[workspace]
members = [
  "crates/editor-core",
  "crates/editor-app",
  # "crates/frontend-gui",
  "crates/frontend-tui",
  "crates/plugin-system",
]
default-members = [
  "crates/editor-core",
  "crates/editor-app",
  "crates/frontend-tui",
  "crates/plugin-system",
]
resolver = "3"

[workspace.dependencies]
editor-app = { path = "crates/editor-app" }
editor-core = { path = "crates/editor-core" }
frontend-gui = { path = "crates/frontend-gui" }
frontend-tui = { path = "crates/frontend-tui" }

log = "0.4.28"
ropey = "1.6.1"
anyhow = "1.0.100"
tokio = "1.47.1"
tokio-stream = "0.1.17"
