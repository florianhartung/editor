[workspace]
members = [
  "crates/core",
  "crates/app",
  "crates/entrypoint",
  "crates/frontend-gui",
  "crates/frontend-tui",
]
resolver = "3"

[workspace.dependencies]
app = { path = "crates/app" }
core = { path = "crates/core" }
frontend-gui = { path = "crates/frontend-gui" }
frontend-tui = { path = "crates/frontend-tui" }

log = "0.4"
thiserror = "2"
ropey = "1"
anyhow = "1"
tokio = "1"
tokio-stream = "0.1"
